<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Research Tool</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        input { width: 80%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; }
        button { margin-top: 10px; padding: 12px 25px; background: #ff0000; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .container { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid #333; border-radius: 10px; }
    </style>
</head>
<body>
    <h3>Video ID Tester</h3>
    <p>Paste the ID (the letters after v=) below:</p>
    <input type="text" id="vidId" placeholder="e.g., e_eQQjfhR_k">
    <button onclick="loadVid()">Load Video</button>

    <div class="container">
        <iframe id="player" src="https://www.youtube-nocookie.com/embed/e_eQQjfhR_k" allowfullscreen></iframe>
    </div>

    <script>
        function loadVid() {
            var id = document.getElementById('vidId').value;
            if(id) {
                document.getElementById('player').src = "https://www.youtube-nocookie.com/embed/" + id;
            }
        }
    </script>
</body>
</html>
